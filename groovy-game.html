<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>GROOOVY BEAT（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #f3e9df; overflow: hidden;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; touch-action: none; }
  canvas.full { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #wipe { position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: 12px; width: 96px; height: 128px;
    border-radius: 12px; background: #1b1210cc; border: 1px solid #ffffff40; display: none; }
  #msg { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); width: min(86vw, 360px);
    color: #3a221c; background: #fffaf3; border: 3px solid #4a2a22; border-radius: 18px; padding: 16px 18px;
    font-size: 14px; line-height: 1.8; text-align: center; box-shadow: 5px 5px 0 #4a2a22; }
  #msg h1 { font-family: "Bagel Fat One", sans-serif; font-weight: 400; font-size: 30px; margin: 0 0 6px; color: #f25f5c;
    -webkit-text-stroke: 1.5px #4a2a22; letter-spacing: .02em; }
  #msg .big { font-family: "Bagel Fat One", sans-serif; font-size: 40px; color: #4a2a22; }
  #msg table { margin: 6px auto 0; border-collapse: collapse; font-size: 14px; }
  #msg td { padding: 1px 10px; text-align: left; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 10px calc(env(safe-area-inset-bottom) + 14px);
    display: flex; gap: 10px; justify-content: center; }
  button { font-family: "Bagel Fat One", -apple-system, sans-serif; font-size: 17px; color: #fffaf3; background: #f25f5c;
    border: 3px solid #4a2a22; border-radius: 999px; padding: 10px 20px; box-shadow: 3px 3px 0 #4a2a22; }
  button.sub { background: #7ea6d6; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #4a2a22; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="gl" class="full"></canvas>
<canvas id="fx" class="full"></canvas>
<canvas id="wipe"></canvas>

<div id="msg">
  <h1>GROOOVY BEAT</h1>
  流れてくる手の形を、<b>判定の円に重なるタイミング</b>で作ろう。<br>
  ✊ グー　✋ パー　✌️ チョキ　👌 OK<br>
  <span style="font-size:12px;opacity:.75">画面を見ながら、インカメラに手を向けて遊びます。最初に「タイミング調整」をおすすめします。</span>
</div>

<div id="controls">
  <button id="start">カメラを起動</button>
  <button id="calib" class="sub hidden">タイミング調整</button>
  <button id="play" class="hidden">PLAY</button>
  <button id="cam" class="sub hidden">カメラ：イン</button>
  <button id="pause" class="sub hidden">一時停止</button>
  <button id="resume" class="hidden">続ける</button>
  <button id="title" class="sub hidden">タイトルへ</button>
</div>

<video id="video" playsinline muted autoplay class="hidden"></video>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("video"), msg = $("msg");
const FONT = '"Bagel Fat One", -apple-system, sans-serif';

// ================= 曲・譜面 =================
const BPM = 96, BEAT = 60 / BPM;
const SHAPES = { fist: "✊", open: "✋", victory: "✌️", ok: "👌" };
const KEYS = Object.keys(SHAPES);
function makeChart() {
  let seed = 20261117; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const notes = []; let prev = null;
  for (let bar = 2; bar < 18; bar++) for (let k = 0; k < 2; k++) {
    let s; do { s = KEYS[Math.floor(rnd() * KEYS.length)]; } while (s === prev);   // 同じ形は続けない
    prev = s; notes.push({ t: (bar * 4 + k * 2) * BEAT, shape: s, judged: false, result: null });
  }
  return notes;
}
const CLICKS = Array.from({ length: 12 }, (_, i) => 0.5 + i * BEAT);   // 調整用クリックの時刻

// ================= 音（<audio> だけを使う。Web Audio は使わない） =================
function mkAudio(src) { const a = new Audio(src); a.preload = "auto"; a.setAttribute("playsinline", ""); return a; }
const song = mkAudio("groovy-beat.m4a"), click = mkAudio("groovy-click.m4a");
// <audio> の時刻は飛び飛びに進むので、その間は経過時間で補う
function makeClock(el) {
  let aT = 0, aPerf = 0;
  return () => {
    const ct = el.currentTime, now = performance.now();
    if (ct !== aT || el.paused || el.seeking) { aT = ct; aPerf = now; return ct; }
    return aT + Math.min(0.2, (now - aPerf) / 1000);
  };
}
const songClock = makeClock(song), clickClock = makeClock(click);

// ================= 遅れの補正 =================
let LAT = 0.12;
try { const v = parseFloat(localStorage.getItem("grooovy_lat")); if (!isNaN(v)) LAT = v; } catch (e) {}

// ================= 背景（GROOOVYの柄） =================
const glc = $("gl"), gl = glc.getContext("webgl2", { antialias: false });
const fx = $("fx"), ctx = fx.getContext("2d");
const GS = Math.min(1.5, window.devicePixelRatio || 1), FXS = Math.min(2, window.devicePixelRatio || 1);
let W = innerWidth, H = innerHeight;
function resize() {
  W = innerWidth; H = innerHeight;
  glc.width = Math.round(W * GS); glc.height = Math.round(H * GS);
  fx.width = Math.round(W * FXS); fx.height = Math.round(H * FXS); ctx.setTransform(FXS, 0, 0, FXS, 0, 0);
}
addEventListener("resize", resize); resize();
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uPhase;    // 流れの進み（速さを積算したもの）
uniform float uAmp;      // うねりの強さ
uniform float uBright;   // 明るさ
uniform float uVib;      // 震え
uniform float uTime;
out vec4 o;

const vec3 CREAM  = vec3(0.953, 0.914, 0.875);
const vec3 BLUE   = vec3(0.494, 0.651, 0.839);
const vec3 YELLOW = vec3(0.941, 0.745, 0.227);
const vec3 PINK   = vec3(0.969, 0.580, 0.722);
const vec3 RED    = vec3(0.949, 0.373, 0.361);
const vec3 LINE   = vec3(0.290, 0.165, 0.133);

vec3 band(float i){
  // 赤→ピンク→黄→青→クリーム→青→黄→ピンク の順に繰り返す
  float k = mod(i, 8.0);
  if (k < 0.5) return RED;   if (k < 1.5) return PINK;  if (k < 2.5) return YELLOW;
  if (k < 3.5) return BLUE;  if (k < 4.5) return CREAM; if (k < 5.5) return BLUE;
  if (k < 6.5) return YELLOW; return PINK;
}
float hash(vec2 v){ return fract(sin(dot(v, vec2(127.1, 311.7))) * 43758.5453); }
// 継ぎ目の出ないなめらかなノイズ（格子点の値を滑らかに補間）
float vnoise(vec2 x){
  vec2 i = floor(x), f = fract(x); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1,0)), u.x), mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x), u.y);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);
  // 震え：細かいランダムなずれ
  if (uVib > 0.001) {
    float tt = uTime * 18.0;
    vec2 n = vec2(vnoise(uv * 3.0 + vec2(tt, 0.0)), vnoise(uv * 3.0 + vec2(0.0, tt) + 5.2)) - 0.5;
    uv += uVib * 0.03 * n;
    uv += uVib * 0.008 * vec2(sin(uTime * 61.0 + uv.y * 9.0), cos(uTime * 57.0 + uv.x * 9.0));
  }
  float t = uPhase;
  vec2 q = uv * 1.6;
  // 二段のドメインワープでうねる帯を作る
  q += uAmp * 0.55 * vec2(sin(q.y * 1.7 + t * 0.9), cos(q.x * 1.5 - t * 0.7));
  q += uAmp * 0.35 * vec2(sin(q.y * 2.9 - t * 0.6 + q.x), cos(q.x * 2.6 + t * 0.8 - q.y));
  float f = q.x + 0.75 * sin(q.y * 1.3 + t * 0.5) + 0.25 * length(q) * sin(t * 0.3);
  float b = f * 2.2 - t * 0.6;
  float idx = floor(b), fr = fract(b);
  vec3 col = band(idx);
  // 帯の境目に茶色の線（太さは画面ピクセル基準）
  float d = min(fr, 1.0 - fr) / max(fwidth(b), 1e-4);
  float lw = 1.1 * (uRes.y / 900.0 + 0.6);
  col = mix(LINE, col, smoothstep(lw - 0.8, lw + 0.8, d));
  col *= uBright;
  o = vec4(col, 1.0);
}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const uRes = U("uRes"), uPhase = U("uPhase"), uAmp = U("uAmp"), uBright = U("uBright"), uVib = U("uVib"), uTime = U("uTime");
const bg = { phase: 0, pulse: 0, shake: 0 };

// ================= 手の形の判定 =================
let landmarker = null, lastVideoTime = -1;
const hand = { lm: null, shape: "none", lastSeen: 0 };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function classify(lm) {
  const palm = dist(lm[0], lm[9]) || 1e-3;
  const ext = (tip, pip) => dist(lm[tip], lm[0]) > dist(lm[pip], lm[0]) * 1.12;
  const i = ext(8, 6), m = ext(12, 10), r = ext(16, 14), p = ext(20, 18);
  const pinch = dist(lm[4], lm[8]) / palm < 0.35;
  if (pinch && m && r && p) return "ok";
  if (i && m && r && p) return "open";
  if (i && m && !r && !p) return "victory";
  if (!i && !m && !r && !p) return "fist";
  return "none";
}

// ================= ゲーム状態 =================
let mode = "idle";           // idle / calib / play / result
let notes = [], history = [], score = 0, combo = 0, maxCombo = 0, counts = {};
let popups = [];             // 判定文字
let calibOnsets = [], prevShape = "none";

function judge(note) {
  const T = note.t + LAT;
  const fr = history.filter(h => h.t >= T - 0.9 && h.t <= T + 0.32);
  // 目標の形が続いている区間（1コマだけの途切れは無視）
  const runs = []; let cur = null, gap = 0, prevT = null;
  for (const h of fr) {
    // 形が変わった瞬間は、前のコマとこのコマの間とみなす（コマの粗さによる遅れを半分にする）
    if (h.s === note.shape) { if (!cur) cur = { start: prevT === null ? h.t : (prevT + h.t) / 2, end: h.t, n: 0 }; cur.end = h.t; cur.n++; gap = 0; prevT = h.t; continue; }
    prevT = h.t;
    if (cur && gap === 0 && h.s === "none") { gap = 1; }
    else if (cur) { runs.push(cur); cur = null; gap = 0; }
  }
  if (cur) runs.push(cur);
  let best = null;
  for (const r of runs) {
    if (r.n < 2 || r.end < T - 0.1 || r.start > T + 0.26) continue;
    if (!best || Math.abs(r.start - T) < Math.abs(best.start - T)) best = r;
  }
  if (!best) return "MISS";
  const err = best.start - T;
  if (err >= -0.10 && err <= 0.08) return "PERFECT";
  if (err >= -0.20 && err <= 0.16) return "COOL";
  if (err >= -0.35 && err <= 0.26) return "GOOD";
  return best.start <= T && best.end >= T ? "GOOD" : "MISS";   // 早めに作って保持していた場合
}
const POINT = { PERFECT: 300, COOL: 200, GOOD: 100, MISS: 0 };
const JCOLOR = { PERFECT: "#f25f5c", COOL: "#7ea6d6", GOOD: "#f0be3a", MISS: "#8a7a72" };

function applyResult(note, res) {
  note.judged = true; note.result = res; counts[res] = (counts[res] || 0) + 1;
  if (res === "MISS") { combo = 0; bg.shake = 1; }
  else { combo++; maxCombo = Math.max(maxCombo, combo); score += POINT[res] + Math.min(combo, 50) * 10; bg.pulse = res === "PERFECT" ? 1 : 0.6; }
  popups.push({ text: res, born: performance.now() });
}

// ================= カメラ・手の認識 =================
let facing = "user", stream = null;   // 画面を見ながら遊ぶので、インカメラが標準
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  video.srcObject = stream; await video.play(); lastVideoTime = -1;
}
async function initLandmarker() {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = delegate => ({ baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 1 });
  try { landmarker = await HandLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch (e) { landmarker = await HandLandmarker.createFromOptions(fileset, opts("CPU")); }
}

// ================= ワイプ（関節の線だけ） =================
const wipe = $("wipe"), wctx = wipe.getContext("2d");
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawWipe() {
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = 96, h = 128;
  if (wipe.width !== w * dpr) { wipe.width = w * dpr; wipe.height = h * dpr; }
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0); wctx.clearRect(0, 0, w, h);
  const lm = hand.lm;
  if (lm) {
    const vw = video.videoWidth || 4, vh = video.videoHeight || 3;
    const sc = Math.min(w / vw, h / vh), ox = (w - vw * sc) / 2, oy = (h - vh * sc) / 2;
    const pt = p => [ox + (facing === "user" ? 1 - p.x : p.x) * vw * sc, oy + p.y * vh * sc];
    wctx.lineWidth = 2; wctx.lineCap = "round"; wctx.strokeStyle = hand.shape === "none" ? "#f3e9df" : "#f0be3a";
    wctx.beginPath(); for (const [a, b] of BONES) { wctx.moveTo(...pt(lm[a])); wctx.lineTo(...pt(lm[b])); } wctx.stroke();
    wctx.fillStyle = "#f794b8";
    for (const p of lm) { const [x, y] = pt(p); wctx.beginPath(); wctx.arc(x, y, 2.2, 0, Math.PI * 2); wctx.fill(); }
  }
  if (hand.shape !== "none") { wctx.font = "22px sans-serif"; wctx.textAlign = "left"; wctx.textBaseline = "bottom"; wctx.fillText(SHAPES[hand.shape], 5, h - 3); }
}

// ================= 描画（譜面・文字） =================
function popText(text, x, y, size, fill, shadow, scale = 1, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  const off = size * 0.07;
  ctx.lineWidth = size * 0.14; ctx.strokeStyle = "#4a2a22"; ctx.fillStyle = shadow;
  ctx.strokeText(text, off, off); ctx.fillText(text, off, off);
  ctx.fillStyle = fill; ctx.strokeText(text, 0, 0); ctx.fillText(text, 0, 0);
  ctx.restore();
}
function drawNoteCircle(x, y, r, shape, alpha = 1, ring = false) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.fillStyle = "#4a2a22"; ctx.beginPath(); ctx.arc(x + 4, y + 4, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = ring ? "rgba(255,250,243,0.35)" : "#fffaf3"; ctx.lineWidth = 4; ctx.strokeStyle = "#4a2a22";
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  if (shape) { ctx.font = `${Math.round(r * 1.05)}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(SHAPES[shape], x, y + r * 0.06); }
  ctx.restore();
}

function drawPlay(t) {
  const laneY = H * 0.6, judgeX = W * 0.22, pps = W * 0.42, r = Math.min(40, W * 0.1);
  // レーン
  ctx.fillStyle = "rgba(74,42,34,0.82)"; ctx.fillRect(0, laneY - r - 12, W, (r + 12) * 2);
  ctx.fillStyle = "rgba(255,250,243,0.12)"; ctx.fillRect(0, laneY - r - 6, W, (r + 6) * 2);
  // 拍の目盛り
  ctx.strokeStyle = "rgba(255,250,243,0.25)"; ctx.lineWidth = 2;
  const b0 = Math.floor(t / BEAT);
  for (let b = b0; b < b0 + 8; b++) { const x = judgeX + (b * BEAT - t) * pps; if (x > judgeX + 4) { ctx.beginPath(); ctx.moveTo(x, laneY - r - 6); ctx.lineTo(x, laneY + r + 6); ctx.stroke(); } }
  // 判定の円（拍に合わせて脈打つ）
  const beatPh = (t / BEAT) % 1, pulse = 1 + 0.08 * Math.exp(-beatPh * 6);
  ctx.save(); ctx.lineWidth = 5; ctx.strokeStyle = "#f0be3a";
  ctx.beginPath(); ctx.arc(judgeX, laneY, r * 1.12 * pulse, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  // ノーツ
  for (const n of notes) {
    const x = judgeX + (n.t - t) * pps;
    if (x > W + r * 2) continue;
    if (n.judged) {
      const age = t - (n.t + LAT + 0.3);
      if (n.result !== "MISS" && age < 0.35) {   // 成功：はじけて消える
        const k = age / 0.35; drawNoteCircle(judgeX, laneY, r * (1 + k * 0.8), null, 1 - k, true);
      } else if (n.result === "MISS" && x > -r * 2) drawNoteCircle(x, laneY, r, n.shape, 0.35);
      continue;
    }
    drawNoteCircle(Math.max(x, -r * 2), laneY, r, n.shape);
  }
  // スコア・コンボ
  popText(String(score).padStart(6, "0"), 92, 56, 30, "#fffaf3", "#f794b8");
  if (combo >= 2) popText(`${combo} COMBO`, W / 2, laneY + r + 46, 24, "#fffaf3", "#7ea6d6");
}

function drawPopups() {
  const now = performance.now(), laneY = H * 0.6;
  popups = popups.filter(p => now - p.born < 700);
  for (const p of popups) {
    const a = (now - p.born) / 700, sc = a < 0.15 ? 1.5 - a / 0.15 * 0.5 : 1;
    popText(p.text, W / 2, laneY - 90 - a * 20, p.text === "PERFECT" ? 46 : 42, "#fffaf3", JCOLOR[p.text], sc, a > 0.7 ? (1 - a) / 0.3 : 1);
  }
}

function drawCalib(t) {
  const ph = t >= 0.5 ? ((t - 0.5) / BEAT) % 1 : 1;
  popText("GRIP!", W / 2, H * 0.42, 56, "#fffaf3", "#f25f5c", 1 + 0.15 * Math.exp(-ph * 6));
  // 次のクリックまでの円
  const idx = CLICKS.findIndex(c => c > t - 0.05);
  if (idx >= 0) {
    const k = Math.max(0, Math.min(1, (CLICKS[idx] - t) / BEAT));
    ctx.save(); ctx.lineWidth = 6; ctx.strokeStyle = "#4a2a22"; ctx.beginPath(); ctx.arc(W / 2, H * 0.62, 30 + k * 60, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#f0be3a"; ctx.beginPath(); ctx.arc(W / 2, H * 0.62, 30, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  popText(`${calibOnsets.length} / ${CLICKS.length}`, W / 2, H * 0.78, 26, "#fffaf3", "#7ea6d6");
}

// ================= メインループ =================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = (mode === "play" || mode === "paused") ? songClock() : mode === "calib" ? clickClock() : 0;

  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, now);
    const lm = res.landmarks && res.landmarks[0];
    if (lm) { hand.lm = lm; hand.shape = classify(lm); hand.lastSeen = now; }
    else if (now - hand.lastSeen > 150) { hand.lm = null; hand.shape = "none"; }
    if (mode === "play") history.push({ t, s: hand.shape });
    if (mode === "calib") {
      if (hand.shape === "fist" && prevShape !== "fist") calibOnsets.push(t);
      prevShape = hand.shape;
    }
  }

  if (mode === "play") {
    history = history.filter(h => h.t > t - 2);
    for (const n of notes) if (!n.judged && t > n.t + LAT + 0.32) applyResult(n, judge(n));
    if (song.ended || t > notes[notes.length - 1].t + 2.5) finishPlay();
  }
  if (mode === "calib" && (click.ended || t > CLICKS[CLICKS.length - 1] + 0.8)) finishCalib();

  // 背景
  bg.phase += dt * (mode === "play" ? 0.9 : 0.35);
  bg.pulse *= 0.9; bg.shake *= 0.88;
  gl.viewport(0, 0, glc.width, glc.height);
  gl.uniform2f(uRes, glc.width, glc.height);
  gl.uniform1f(uPhase, bg.phase);
  gl.uniform1f(uAmp, 0.9 + bg.pulse * 0.6);
  gl.uniform1f(uBright, 0.95 + bg.pulse * 0.12);
  gl.uniform1f(uVib, bg.shake);
  gl.uniform1f(uTime, now / 1000);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  ctx.clearRect(0, 0, W, H);
  if (mode === "play" || mode === "paused") drawPlay(t);
  if (mode === "calib") drawCalib(t);
  drawPopups();
  drawWipe();
  requestAnimationFrame(loop);
}

// ================= 画面の切り替え =================
function showMsg(html) { msg.innerHTML = html; msg.classList.remove("hidden"); }
function setButtons(list) { for (const id of ["start", "calib", "play", "cam", "pause", "resume", "title"]) $(id).classList.toggle("hidden", !list.includes(id)); }

function startPlay() {
  notes = makeChart(); history = []; score = 0; combo = 0; maxCombo = 0; counts = {}; popups = [];
  song.currentTime = 0; const pr = song.play(); if (pr && pr.catch) pr.catch(() => {});
  mode = "play"; msg.classList.add("hidden"); setButtons(["pause"]);
}
function toTitle() {
  song.pause(); click.pause(); mode = "idle"; msg.style.top = ""; popups = [];
  $("play").textContent = "PLAY";
  showMsg(`<h1>GROOOVY BEAT</h1>✊ グー　✋ パー　✌️ チョキ　👌 OK<br><span style="font-size:12px;opacity:.75">今の補正値：${Math.round(LAT * 1000)}ms</span>`);
  setButtons(["calib", "play", "cam"]);
}
function pausePlay() { if (mode !== "play") return; song.pause(); mode = "paused"; showMsg("<h1>PAUSE</h1>"); setButtons(["resume", "title"]); }
function resumePlay() { if (mode !== "paused") return; msg.classList.add("hidden"); const pr = song.play(); if (pr && pr.catch) pr.catch(() => {}); mode = "play"; setButtons(["pause"]); }

function finishPlay() {
  mode = "result"; song.pause();
  const c = k => counts[k] || 0;
  showMsg(`<h1>RESULT</h1><div class="big">${score}</div>
    <table><tr><td>PERFECT</td><td>${c("PERFECT")}</td></tr><tr><td>COOL</td><td>${c("COOL")}</td></tr>
    <tr><td>GOOD</td><td>${c("GOOD")}</td></tr><tr><td>MISS</td><td>${c("MISS")}</td></tr>
    <tr><td>MAX COMBO</td><td>${maxCombo}</td></tr></table>`);
  $("play").textContent = "もう一度"; setButtons(["play", "title"]);
}
function startCalib() {
  calibOnsets = []; prevShape = hand.shape;
  click.currentTime = 0; const pr = click.play(); if (pr && pr.catch) pr.catch(() => {});
  mode = "calib"; setButtons(["title"]);
  showMsg(`<b>パーの形から、クリック音に合わせて手を握ってください（全12回）。</b>`);
  msg.style.top = "16%";
}
function finishCalib() {
  mode = "idle"; click.pause(); msg.style.top = "";
  const d = [];
  for (const o of calibOnsets) {
    let best = null; for (const c of CLICKS) if (best === null || Math.abs(o - c) < Math.abs(best)) best = o - c;
    if (best !== null && Math.abs(best) < 0.45) d.push(best);
  }
  if (d.length < 4) {
    showMsg(`<h1>もう一度</h1>握った回数をうまく読み取れませんでした（${d.length}回）。<br>手全体がカメラに映るようにして、もう一度試してください。<br>今の補正値：${Math.round(LAT * 1000)}ms`);
  } else {
    d.sort((a, b) => a - b); LAT = Math.max(-0.1, Math.min(0.45, d[Math.floor(d.length / 2)]));
    try { localStorage.setItem("grooovy_lat", String(LAT)); } catch (e) {}
    showMsg(`<h1>OK!</h1>遅れの補正：<b>${Math.round(LAT * 1000)}ms</b>（${d.length}回分の中央値）<br>PLAYで始めよう。`);
  }
  setButtons(["calib", "play", "cam"]);
}

$("start").addEventListener("click", async () => {
  const b = $("start"); b.disabled = true; b.textContent = "準備中…";
  try {
    await startCamera(); await initLandmarker();
    wipe.style.display = "block"; setButtons(["calib", "play", "cam"]);
    showMsg(`<h1>READY</h1>まずは「タイミング調整」で、手の認識の遅れを測っておくと判定が正確になります。<br><span style="font-size:12px;opacity:.75">今の補正値：${Math.round(LAT * 1000)}ms</span>`);
  } catch (e) {
    b.disabled = false; b.textContent = "カメラを起動";
    showMsg("起動できませんでした：" + (e && e.message ? e.message : e) + "<br>（https で開いているか、カメラの許可を確認してください）");
  }
});
$("calib").addEventListener("click", startCalib);
$("play").addEventListener("click", startPlay);
$("pause").addEventListener("click", pausePlay);
$("resume").addEventListener("click", resumePlay);
$("title").addEventListener("click", toTitle);
$("cam").addEventListener("click", async () => {
  facing = facing === "user" ? "environment" : "user";
  $("cam").textContent = "カメラ：" + (facing === "user" ? "イン" : "背面");
  try { await startCamera(); } catch (e) { showMsg("カメラ切替に失敗：" + e.message); }
});

document.fonts && document.fonts.load(`30px ${FONT}`).catch(() => {});
requestAnimationFrame(loop);
</script>
