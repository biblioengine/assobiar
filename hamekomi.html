<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>映像はめ込み（試作）</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #eef1f6; overflow: hidden;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #status { position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 12px; right: 12px;
    font-size: 13px; line-height: 1.6; text-shadow: 0 1px 3px #000; }
  #hint { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    background: #000a; padding: 10px 16px; border-radius: 12px; font-size: 15px; display: none; text-align: center; }
  #controls { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: auto;
    padding: 12px 10px calc(env(safe-area-inset-bottom) + 12px);
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    background: linear-gradient(transparent, #000b 45%); }
  button { font: inherit; font-size: 14px; color: #eef1f6; background: #20242e; border: 1px solid #ffffff2a;
    border-radius: 999px; padding: 10px 15px; }
  button.on { background: #3b5bdb; border-color: #3b5bdb; }
  #start { font-size: 16px; padding: 14px 28px; background: #3b5bdb; border-color: #3b5bdb; }
  .hidden { display: none !important; }
  #help { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); width: min(88vw, 370px);
    font-size: 14px; line-height: 1.8; background: #151922; border: 1px solid #ffffff1a; border-radius: 14px; padding: 18px 20px; }
  #help h1 { font-size: 17px; margin: 0 0 8px; }
  #help ol { margin: 6px 0 0; padding-left: 1.3em; }
  #help .note { font-size: 12px; opacity: .7; margin-top: 10px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>

<div id="help">
  <h1>映像はめ込み（試作）</h1>
  <ol>
    <li>背面カメラで窓や看板を映す</li>
    <li>「範囲を指定」を押して、四隅をタップ</li>
    <li>「動画を選ぶ」で、はめ込む動画を選ぶ</li>
    <li>手のジェスチャーで操作
      <br>パー（少し保持）：映像オン
      <br>グー（少し保持）：映像オフ
      <br>手首を右に傾ける：速く／左：ゆっくり</li>
  </ol>
  <div class="note">スマホはなるべくその場で構えたまま使ってください。追跡が外れたら範囲を指定し直します。</div>
</div>

<div id="ui">
  <div id="status"></div>
  <div id="hint"></div>
</div>

<div id="controls">
  <button id="start">開始</button>
  <button id="pick" class="hidden">動画を選ぶ</button>
  <button id="area" class="hidden">範囲を指定</button>
</div>
<input id="file" type="file" accept="video/*" class="hidden">

<video id="cam" playsinline muted autoplay class="hidden"></video>
<video id="clip" playsinline muted loop class="hidden"></video>

<script type="module">
import { FilesetResolver, GestureRecognizer } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const cam = $("cam"), clip = $("clip");
const glc = $("gl"), ov = $("ov"), octx = ov.getContext("2d");
const statusEl = $("status"), hintEl = $("hint");

// ================= 画面サイズと座標変換 =================
const DPR = Math.min(2, window.devicePixelRatio || 1);
let W = innerWidth, H = innerHeight;
function resize() {
  W = innerWidth; H = innerHeight;
  for (const c of [glc, ov]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

// カメラ映像を画面いっぱいに表示（はみ出し分は切る）したときの対応
function cover() {
  const vw = cam.videoWidth || 1, vh = cam.videoHeight || 1;
  const s = Math.max(W / vw, H / vh);
  return { s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2, vw, vh };
}
const vidToScreen = (x, y) => { const c = cover(); return [x * c.s + c.ox, y * c.s + c.oy]; };
const screenToVid = (x, y) => { const c = cover(); return [(x - c.ox) / c.s, (y - c.oy) / c.s]; };

// ================= WebGL 描画 =================
const gl = glc.getContext("webgl", { premultipliedAlpha: false, antialias: false });
const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
const FS = `
precision mediump float;
uniform vec2 uRes;            // 端末ピクセル
uniform vec4 uCover;          // s, ox, oy, 1/DPR
uniform vec2 uVid;            // カメラ映像の幅・高さ
uniform sampler2D uCam, uClip;
uniform mat3 uHinv;           // 画面 → はめ込み範囲(0..1)
uniform float uHasQuad, uHasClip, uAlpha, uTime;
void main(){
  vec2 fc = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) * uCover.w;  // CSSピクセル
  vec2 cuv = ((fc - uCover.yz) / uCover.x) / uVid;
  vec3 col = texture2D(uCam, cuv).rgb;
  if (uHasQuad > 0.5 && uAlpha > 0.001) {
    vec3 q = uHinv * vec3(fc, 1.0);
    vec2 uv = q.xy / q.z;
    if (q.z > 0.0 && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) {
      vec3 m;
      if (uHasClip > 0.5) m = texture2D(uClip, uv).rgb;
      else {  // 動画未選択時のテスト模様
        float k = step(0.5, fract(uv.x * 6.0)) + step(0.5, fract(uv.y * 4.0));
        m = mix(vec3(0.25,0.35,0.9), vec3(0.95,0.75,0.3), mod(k, 2.0)) * (0.8 + 0.2 * sin(uTime * 3.0));
      }
      col = mix(col, m, uAlpha);
    }
  }
  gl_FragColor = vec4(col, 1.0);
}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const uRes = U("uRes"), uCover = U("uCover"), uVid = U("uVid"), uHinv = U("uHinv"),
      uHasQuad = U("uHasQuad"), uHasClip = U("uHasClip"), uAlpha = U("uAlpha"), uTime = U("uTime");
function mkTex(unit) {
  const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  for (const [k, v] of [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE],
    [gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
  return t;
}
const texCam = mkTex(0), texClip = mkTex(1);
gl.uniform1i(U("uCam"), 0); gl.uniform1i(U("uClip"), 1);

// 単位正方形 → 四角形 のホモグラフィ（行優先 3x3）
function squareToQuad(q) {
  const [x0,y0] = q[0], [x1,y1] = q[1], [x2,y2] = q[2], [x3,y3] = q[3];
  const dx1 = x1-x2, dx2 = x3-x2, dx3 = x0-x1+x2-x3, dy1 = y1-y2, dy2 = y3-y2, dy3 = y0-y1+y2-y3;
  let g = 0, h = 0;
  if (Math.abs(dx3) > 1e-9 || Math.abs(dy3) > 1e-9) {
    const den = dx1*dy2 - dx2*dy1;
    g = (dx3*dy2 - dx2*dy3) / den; h = (dx1*dy3 - dx3*dy1) / den;
  }
  return [x1-x0+g*x1, x3-x0+h*x3, x0,  y1-y0+g*y1, y3-y0+h*y3, y0,  g, h, 1];
}
function inv3(m) {
  const [a,b,c,d,e,f,g,h,i] = m;
  return [e*i-f*h, c*h-b*i, b*f-c*e,  f*g-d*i, a*i-c*g, c*d-a*f,  d*h-e*g, b*g-a*h, a*e-b*d];
}
const colMajor = m => [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]];

// ================= 追跡（四隅の模様を毎フレーム探す） =================
const TW = 400; let TH = 300;
const tc = document.createElement("canvas"); const tctx = tc.getContext("2d", { willReadFrequently: true });
let gray = null;
const PR = 7, SR = 12, PN = (2*PR+1) ** 2;   // 模様の半径・探す範囲

function grabGray() {
  TH = Math.round(TW * cam.videoHeight / cam.videoWidth);
  if (tc.width !== TW || tc.height !== TH) { tc.width = TW; tc.height = TH; gray = new Float32Array(TW * TH); }
  tctx.drawImage(cam, 0, 0, TW, TH);
  const d = tctx.getImageData(0, 0, TW, TH).data;
  for (let i = 0, j = 0; i < gray.length; i++, j += 4) gray[i] = 0.299*d[j] + 0.587*d[j+1] + 0.114*d[j+2];
}
const inside = (x, y, m) => x >= m && y >= m && x < TW - m && y < TH - m;

function makeTemplate(x, y) {
  const cx = Math.round(x), cy = Math.round(y);
  if (!inside(cx, cy, PR + 1)) return null;
  const t = new Float32Array(PN); let k = 0, s = 0;
  for (let v = -PR; v <= PR; v++) for (let u = -PR; u <= PR; u++) { t[k] = gray[(cy+v)*TW + cx+u]; s += t[k++]; }
  const m = s / PN; let n = 0;
  for (let i = 0; i < PN; i++) { t[i] -= m; n += t[i] * t[i]; }
  return { t, norm: Math.sqrt(n) || 1 };
}

function ncc(tpl, cx, cy) {
  let sp = 0, sp2 = 0, stp = 0, k = 0;
  for (let v = -PR; v <= PR; v++) {
    const row = (cy+v)*TW + cx;
    for (let u = -PR; u <= PR; u++) { const p = gray[row+u]; sp += p; sp2 += p*p; stp += tpl.t[k++] * p; }
  }
  const pn = Math.sqrt(Math.max(1e-6, sp2 - sp*sp/PN));
  return stp / (tpl.norm * pn);
}

function trackOne(c) {
  const bx = Math.round(c.x), by = Math.round(c.y);
  const S = 2*SR+1, sc = new Float32Array(S*S).fill(-2);
  let best = -2, bestPen = -9, bu = 0, bv = 0;
  for (let v = -SR; v <= SR; v++) for (let u = -SR; u <= SR; u++) {
    const x = bx+u, y = by+v;
    if (!inside(x, y, PR + 1)) continue;
    const s = ncc(c.tpl, x, y); sc[(v+SR)*S + u+SR] = s;
    const pen = s - 0.0015 * (u*u + v*v);   // 似た模様が並ぶ窓枠などで遠くへ飛ばないよう、近い候補を優先
    if (pen > bestPen) { bestPen = pen; best = s; bu = u; bv = v; }
  }
  // 小数点以下の位置を放物線で補う
  const at = (u, v) => (Math.abs(u) <= SR && Math.abs(v) <= SR) ? sc[(v+SR)*S + u+SR] : -2;
  let fu = 0, fv = 0;
  const l = at(bu-1,bv), r = at(bu+1,bv), t = at(bu,bv-1), b = at(bu,bv+1);
  if (l > -2 && r > -2) { const den = l - 2*best + r; if (den < 0) fu = 0.5 * (l - r) / den; }
  if (t > -2 && b > -2) { const den = t - 2*best + b; if (den < 0) fv = 0.5 * (t - b) / den; }
  return { x: bx + bu + Math.max(-.5, Math.min(.5, fu)), y: by + bv + Math.max(-.5, Math.min(.5, fv)), score: best };
}

let corners = null;   // [{x,y,tpl,dx,dy}] 追跡用座標（TW基準）
let shown = null;     // 表示用に平滑化した四隅（カメラ映像の座標）
let trackQuality = "";
let lostSince = 0;

function trackAll(handBox) {
  let gx = 0, gy = 0, gn = 0; const res = [];
  for (const c of corners) {
    const hidden = handBox && c.x > handBox[0] && c.x < handBox[2] && c.y > handBox[1] && c.y < handBox[3];
    if (hidden || !c.tpl) { res.push(null); continue; }
    const r = trackOne(c);
    if (r.score > 0.6) { res.push(r); gx += r.x - c.x; gy += r.y - c.y; gn++; } else res.push(null);
  }
  const mx = gn ? gx / gn : 0, my = gn ? gy / gn : 0;
  corners.forEach((c, i) => {
    if (res[i]) { c.x = res[i].x; c.y = res[i].y; }
    else if (gn) { c.x += mx; c.y += my; }   // 隠れた角は他の角と同じだけ動かす
  });
  const now = performance.now();
  if (gn >= 2) lostSince = 0; else if (!lostSince) lostSince = now;
  trackQuality = gn >= 3 ? "良好" : gn === 2 ? "やや不安定" : (now - lostSince > 800 ? "外れました（範囲を指定し直してください）" : "不安定");
}

// ================= 手のジェスチャー =================
let recognizer = null;
const gesture = { name: "なし", since: 0, applied: null, tilt: 0, present: false };
let videoOn = false, alpha = 0, rate = 1, rateSm = 1;

function handleHand(res) {
  const lm = res.landmarks && res.landmarks[0];
  const g = res.gestures && res.gestures[0] && res.gestures[0][0];
  const now = performance.now();
  if (!lm) { gesture.present = false; gesture.name = "なし"; return null; }
  gesture.present = true;
  const name = g && g.score > 0.55 ? g.categoryName : "None";
  if (name !== gesture.name) { gesture.name = name; gesture.since = now; }
  if (now - gesture.since > 400 && gesture.applied !== name) {
    if (name === "Open_Palm") { setOn(true); gesture.applied = name; }
    else if (name === "Closed_Fist") { setOn(false); gesture.applied = name; }
    else if (name !== "None") gesture.applied = name;
  }
  // 手首の傾き → 速さ（グーのときは変えない）
  const ang = Math.atan2(lm[9].x - lm[0].x, lm[0].y - lm[9].y);
  gesture.tilt += (ang - gesture.tilt) * 0.3;
  if (name !== "Closed_Fist") {
    let t = gesture.tilt / 0.7; t = Math.max(-1, Math.min(1, t));
    t = Math.abs(t) < 0.15 ? 0 : (t - Math.sign(t) * 0.15) / 0.85;
    rate = t >= 0 ? 1 + t * 2 : 1 + t * 0.5;      // 0.5〜3.0倍
  }
  // 手が覆っている範囲（追跡座標）
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
  for (const p of lm) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  const m = 0.06;
  return [(x0 - m) * TW, (y0 - m) * TH, (x1 + m) * TW, (y1 + m) * TH];
}

function setOn(on) {
  videoOn = on;
  if (on && clip.src) { const p = clip.play(); if (p && p.catch) p.catch(() => {}); }
}

// ================= 範囲の指定（四隅タップ） =================
let tapMode = false, taps = [];
function orderQuad(pts) {
  const cx = pts.reduce((s, p) => s + p[0], 0) / 4, cy = pts.reduce((s, p) => s + p[1], 0) / 4;
  const s = pts.slice().sort((a, b) => Math.atan2(a[1]-cy, a[0]-cx) - Math.atan2(b[1]-cy, b[0]-cx));
  let k = 0; s.forEach((p, i) => { if (p[0]+p[1] < s[k][0]+s[k][1]) k = i; });
  return [...s.slice(k), ...s.slice(0, k)];   // 左上・右上・右下・左下
}
ov.addEventListener("pointerdown", e => {
  if (!tapMode) return;
  taps.push([e.clientX, e.clientY]);
  if (taps.length === 4) {
    const q = orderQuad(taps);
    grabGray();
    const k = TW / cam.videoWidth;
    corners = q.map(([sx, sy]) => {
      const [vx, vy] = screenToVid(sx, sy); const x = vx * k, y = vy * k;
      return { x, y, tpl: makeTemplate(x, y) };
    });
    shown = q.map(([sx, sy]) => screenToVid(sx, sy));
    lostSince = 0;
    tapMode = false; $("area").classList.remove("on");
    hintEl.style.display = "none";
  } else showHint();
});
function showHint() { hintEl.style.display = "block"; hintEl.textContent = `窓や看板の四隅をタップ（${taps.length}/4）`; }

// ================= メインループ =================
let lastCamT = -1;
function loop(ts) {
  if (cam.readyState >= 2) {
    let handBox = null;
    if (cam.currentTime !== lastCamT) {
      lastCamT = cam.currentTime;
      if (recognizer) handBox = handleHand(recognizer.recognizeForVideo(cam, performance.now()));
      if (corners && !tapMode) {
        grabGray(); trackAll(handBox);
        const k = cam.videoWidth / TW;
        shown = shown.map((p, i) => [p[0] + (corners[i].x * k - p[0]) * 0.5, p[1] + (corners[i].y * k - p[1]) * 0.5]);
      }
    }
    // フェード・速さ
    alpha += ((videoOn ? 1 : 0) - alpha) * 0.12;
    if (!videoOn && alpha < 0.02 && !clip.paused) clip.pause();
    rateSm += (rate - rateSm) * 0.15;
    if (clip.src && Math.abs(clip.playbackRate - rateSm) > 0.03) clip.playbackRate = Math.round(rateSm * 20) / 20;

    // テクスチャ更新
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texCam);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cam);
    const hasClip = clip.src && clip.readyState >= 2;
    if (hasClip && alpha > 0.001) {
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texClip);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, clip);
    }
    const c = cover();
    gl.viewport(0, 0, glc.width, glc.height);
    gl.uniform2f(uRes, glc.width, glc.height);
    gl.uniform4f(uCover, c.s, c.ox, c.oy, 1 / DPR);
    gl.uniform2f(uVid, c.vw, c.vh);
    gl.uniform1f(uTime, ts / 1000);
    gl.uniform1f(uHasClip, hasClip ? 1 : 0);
    gl.uniform1f(uAlpha, alpha);
    let quadScr = null;
    if (shown && !tapMode) {
      quadScr = shown.map(p => vidToScreen(p[0], p[1]));
      gl.uniformMatrix3fv(uHinv, false, colMajor(inv3(squareToQuad(quadScr))));
      gl.uniform1f(uHasQuad, 1);
    } else gl.uniform1f(uHasQuad, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // 枠線・タップ点
    octx.clearRect(0, 0, W, H);
    octx.lineWidth = 1.5; octx.strokeStyle = "rgba(255,255,255,0.45)"; octx.fillStyle = "#7da2ff";
    if (quadScr) { octx.beginPath(); quadScr.forEach((p, i) => i ? octx.lineTo(...p) : octx.moveTo(...p)); octx.closePath(); octx.stroke(); }
    if (tapMode) for (const p of taps) { octx.beginPath(); octx.arc(p[0], p[1], 7, 0, Math.PI * 2); octx.fill(); }
  }
  const gName = { Open_Palm: "パー", Closed_Fist: "グー", None: "その他", "なし": "なし",
    Pointing_Up: "指差し", Thumb_Up: "親指上", Thumb_Down: "親指下", Victory: "ピース", ILoveYou: "ILY" }[gesture.name] || gesture.name;
  statusEl.innerHTML = `手：<b>${gName}</b>　映像：<b>${videoOn ? "オン" : "オフ"}</b>　速さ：<b>${rateSm.toFixed(2)}倍</b>`
    + (corners ? `<br>追跡：${trackQuality}` : "<br>範囲：未指定")
    + (clip.src ? "" : "（動画未選択：テスト模様を表示）");
  requestAnimationFrame(loop);
}

// ================= 起動・操作 =================
async function initRecognizer() {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = delegate => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task", delegate },
    runningMode: "VIDEO", numHands: 1
  });
  try { recognizer = await GestureRecognizer.createFromOptions(fileset, opts("GPU")); }
  catch (e) { recognizer = await GestureRecognizer.createFromOptions(fileset, opts("CPU")); }
}

$("start").addEventListener("click", async () => {
  const b = $("start"); b.disabled = true; b.textContent = "準備中…";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    cam.srcObject = stream; await cam.play();
    await initRecognizer();
    $("help").classList.add("hidden"); b.classList.add("hidden");
    $("pick").classList.remove("hidden"); $("area").classList.remove("hidden");
    requestAnimationFrame(loop);
  } catch (e) {
    b.disabled = false; b.textContent = "開始";
    statusEl.textContent = "起動できませんでした：" + (e && e.message ? e.message : e) + "（https で開いているか、カメラの許可を確認してください）";
  }
});

$("area").addEventListener("click", () => {
  tapMode = !tapMode; taps = [];
  $("area").classList.toggle("on", tapMode);
  if (tapMode) showHint(); else hintEl.style.display = "none";
});

$("pick").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", () => {
  const f = $("file").files[0]; if (!f) return;
  if (clip.src) URL.revokeObjectURL(clip.src);
  clip.src = URL.createObjectURL(f); clip.load();
  clip.addEventListener("loadeddata", () => { if (videoOn) setOn(true); }, { once: true });
  $("pick").textContent = "動画を変える";
});
</script>
</body>
</html>
